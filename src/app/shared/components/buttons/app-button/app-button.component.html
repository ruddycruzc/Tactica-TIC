@if (routerLink) {
  <a
    [class]="classes"
    [routerLink]="routerLink"
    [attr.aria-label]="ariaLabel"
    [attr.aria-disabled]="disabled || null"
    [attr.tabindex]="disabled ? -1 : null"
    (click)="onClick($event)"
  >
    <ng-content></ng-content>
  </a>
} @else if (href) {
  <a
    [class]="classes"
    [href]="disabled ? null : href"
    [attr.target]="target"
    [attr.rel]="rel"
    [attr.aria-label]="ariaLabel"
    [attr.aria-disabled]="disabled || null"
    [attr.tabindex]="disabled ? -1 : null"
    (click)="onClick($event)"
  >
    <ng-content></ng-content>
  </a>
} @else {
  <button
    [class]="classes"
    [type]="type"
    [disabled]="disabled"
    [attr.aria-label]="ariaLabel"
    (click)="onClick($event)"
  >
    <ng-content></ng-content>
  </button>
}
