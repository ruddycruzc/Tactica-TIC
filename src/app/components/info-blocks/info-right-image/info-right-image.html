<section class="info-section">

  <div class="info-card">

    <div class="info-content">

      <span class="info-tag">
        {{ 'HOME.INFO.TAG' | translate }}
      </span>

      <h2 class="info-title">
        {{ 'HOME.INFO.TITLE' | translate }}
      </h2>

      <p class="info-description">
        {{ 'HOME.INFO.DESCRIPTION' | translate }}
      </p>

      <app-button
        variant="primary"
        routerLink="/about">

        {{ 'HOME.INFO.BUTTON' | translate }}
        <span aria-hidden="true">→</span>

      </app-button>

    </div>

    <div class="info-image">

      <img
        src="assets/images/placeholder-tech.jpg"
        [attr.alt]="'HOME.INFO.IMAGE_ALT' | translate">

    </div>

  </div>

</section>
