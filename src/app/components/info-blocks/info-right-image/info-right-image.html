<section class="info-section">

  <div class="info-card">

    <div class="info-content">

      <span class="info-tag">

        {{ infoContent.tag | translate }}

      </span>

      <h2 class="info-title">

        {{ infoContent.title | translate }}

      </h2>

      <p class="info-description">

        {{ infoContent.description | translate }}

      </p>

      <app-button
        variant="primary"
        routerLink="/about">

        {{ infoContent.button | translate }}

        <span aria-hidden="true">→</span>

      </app-button>

    </div>

    <div class="info-image">

      <img
        src="assets/images/placeholder-tech.jpg"
        [attr.alt]="infoContent.imageAlt | translate">

    </div>

  </div>

</section>
