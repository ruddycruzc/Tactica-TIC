<section class="project2-section">
  <p class="project2-section__statement">
    <span>Transformamos procesos industriales conectando</span>
    inteligencia artificial, IoT, visión artificial y software a medida
    para ayudar a las empresas a controlar,
    <strong>automatizar</strong>
    <span>y tomar mejores decisiones.</span>
  </p>

  <div class="project2-section__grid">
    @for (card of cards; track card.image) {
      <app-project2
        [image]="card.image"
        [imageAlt]="card.imageAlt"
        [title]="card.title"
        [description]="card.description">
      </app-project2>
    }
  </div>
</section>
