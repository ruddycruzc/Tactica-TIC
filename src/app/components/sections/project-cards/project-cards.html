<section class="project-cards" aria-label="Proyectos destacados">
  <div class="project-cards__list">
    @for (card of cards; track card.title + card.image; let index = $index) {
      <a
        class="project-cards__item"
        [class.project-cards__item--selected]="activeIndex === index"
        (mouseenter)="selectCard(index)"
        (focus)="selectCard(index)"
        routerLink="/projects">
        <div class="project-cards__copy">
          <h3>{{ card.title }}</h3>
          <p>{{ card.description }}</p>
        </div>

        <img [src]="card.image" [alt]="card.imageAlt">
      </a>
    }
  </div>
</section>
