<section class="home-projects home-section">
  <div class="home-projects__inner home-section__inner">
    <div class="home-projects__header">
      <div>
        <h2>
          {{ 'HOME.HOME_PROJECTS.TITLE' | translate }}
        </h2>
        <p>
          {{ 'HOME.HOME_PROJECTS.DESCRIPTION' | translate }}
        </p>
      </div>

<app-button variant="primary" routerLink="/projects">
  {{ 'HOME.HOME_PROJECTS.BUTTON_LABEL' | translate }}
</app-button>
    </div>

    <div
      class="home-projects__grid"
      appScrollReveal
      scrollRevealRootMargin="0px 0px -22% 0px"
      [scrollRevealThreshold]="0.28">
      @for (project of projects; track project.title; let index = $index) {
        <div
          class="home-projects__card tt-card-reveal"
          [style.--reveal-index]="index">
          <app-project-card
            [image]="project.image"
            [title]="project.title"
            [description]="project.description"
            buttonLabel="HOME.HOME_PROJECTS.CARD_BUTTON" 
            buttonRouterLink="/projects"
          />
        </div>    }
    </div>
  </div>
</section>
