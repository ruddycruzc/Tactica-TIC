<section class="product-showcase home-section">
  <div class="product-showcase__inner home-section__inner">
    @for (product of products; track product.id; let index = $index) {
      <div
        class="product-showcase__slot"
        [class.product-showcase__slot--active]="activeIndex === index"
        [style.--showcase-index]="index"
        (mouseenter)="setActive(index)"
        (focusin)="setActive(index)"
        (click)="openProduct(product.url)"
        tabindex="0"
      >
        <app-expandable-image-card
          [title]="'HOME.PRODUCT_SHOWCASE.PRODUCTS.' + product.id + '.TITLE' | translate"
          [description]="
            'HOME.PRODUCT_SHOWCASE.PRODUCTS.' + product.id + '.DESCRIPTION' | translate
          "
          [image]="product.image"
          [expanded]="activeIndex === index"
        >
        </app-expandable-image-card>
      </div>
    }

    <div class="product-showcase__slot product-showcase__slot--static">
      <app-background-color-info-card
        tone="dark"
        variant="small"
        [title]="'HOME.PRODUCT_SHOWCASE.SIDE_CARD.TITLE' | translate"
        [emphasis]="'HOME.PRODUCT_SHOWCASE.SIDE_CARD.EMPHASIS' | translate"
        [buttonLabel]="'HOME.PRODUCT_SHOWCASE.SIDE_CARD.BUTTON_LABEL' | translate"
      >
      </app-background-color-info-card>
    </div>
  </div>
</section>
