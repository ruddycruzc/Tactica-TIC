<link rel="stylesheet" href="./services-section.css"> 
<section class="services-container">
  <div class="services-content">
    
    <div class="services-header">
      <h2 class="services-title">Nuestras <span class="highlight-green">Áreas de Trabajo</span></h2>
      <p class="services-subtitle">
        Diseñamos estrategias y sistemas robustos para proyectar empresas estables, competitivas y en constante evolución.
      </p>
    </div>

    <div class="services-grid">
      <!-- Bucle dinámico -->
      <div class="service-card" *ngFor="let srv of services">
        <div class="service-icon"></div>
        <h3>{{ srv.title }}</h3>
        <p class="service-description">{{ srv.description }}</p>
        <ul class="service-features">
          <li *ngFor="let feat of srv.features">{{ feat }}</li>
        </ul>
      </div>
    </div>

  </div>
</section>
