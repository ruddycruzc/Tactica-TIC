<section class="jobs-container">
  <div class="jobs-content">
    <header class="jobs-main-header">
      <h2 class="jobs-title">Portal de Empleo e Innovación</h2>
      <p class="jobs-lead">
        Compartimos nuestra actividad pública, apariciones en prensa y contribuciones al sector de la ingeniería de software y la innovación.
      </p>
    </header>

    <div
      class="jobs-grid"
      appScrollReveal
      scrollRevealRootMargin="0px 0px -18% 0px"
      [scrollRevealThreshold]="0.2">
      <app-image-text-card
        *ngFor="let card of jobCards; let index = index"
        class="tt-card-reveal"
        [style.--reveal-index]="index"
        [image]="card.imgSrc"
        [imageAlt]="card.altText"
        [title]="card.title"
        [description]="card.description">
      </app-image-text-card>
    </div>
  </div>
</section>
