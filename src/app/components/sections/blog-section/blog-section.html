<section class="blog-container">
  <div class="blog-content">
    <div class="blog-header">
      <h2 class="blog-title">TÁCTICA TIC en los <span class="highlight-green">Medios</span></h2>
      <p class="blog-subtitle">
        Compartimos nuestra actividad pública, apariciones en prensa y contribuciones al sector de la ingeniería de software y la innovación.
      </p>
    </div>

    <!-- Rejilla dinámica optimizada con @for -->
    <div class="blog-grid">
      
      @for (post of posts; track post.title) {
        <article class="blog-card">
          <div class="blog-meta">
            <span class="media-badge">{{ post.badge }}</span>
          </div>
          <h3 class="article-title">{{ post.title }}</h3>
          <p class="article-excerpt">{{ post.excerpt }}</p>

          <div class="article-footer">
            <app-button variant="tertiary" [href]="post.url" target="_blank" rel="noopener noreferrer">
              Leer artículo completo <span class="arrow">→</span>
            </app-button>
          </div>
        </article>
      }

      <!-- Imágenes estáticas del final -->
      <img src="assets/images/mesa-reunion.jpg" alt="reunion" class="blog-placeholder" />
      <img src="assets/images/interview.jpg" alt="interview" class="blog-placeholder" />
      <img src="assets/images/coworkers.jpg" alt="office" class="blog-placeholder" />

    </div>
  </div>
</section>
