<section class="blog-page-section">
  <div class="blog-page-section__inner">
    <header class="blog-page-section__header">
      <h2>Blogs</h2>
      <p>
        Compartimos nuestra actividad pública, apariciones en prensa y contribuciones al sector de la ingeniería de software y la innovación.
      </p>
    </header>

    <div class="blog-page-section__grid">
      @for (post of posts; track $index) {
        <app-project-card
          [image]="post.image"
          [imageAlt]="post.imageAlt"
          [title]="post.title"
          [description]="post.excerpt"
          buttonLabel="Seguir leyendo"
          [buttonHref]="post.url"
          buttonTarget="_blank"
        />
      }
    </div>

    <nav class="blog-page-section__controls" aria-label="Paginación de blogs">
      <app-button variant="primary" iconOnly ariaLabel="Anterior">
        <span aria-hidden="true">←</span>
      </app-button>

      <div class="blog-page-section__dots" aria-hidden="true">
        @for (indicator of indicators; track indicator) {
          <span class="blog-page-section__dot" [class.blog-page-section__dot--active]="indicator === 0"></span>
        }
      </div>

      <app-button variant="primary" iconOnly ariaLabel="Siguiente">
        <span aria-hidden="true">→</span>
      </app-button>
    </nav>
  </div>
</section>
