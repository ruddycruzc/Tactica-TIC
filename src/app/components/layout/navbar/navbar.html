<nav class="navbar">
  <a routerLink="/" class="navbar__logo" (click)="closeMenu()">
    <img src="/assets/Logos/logo-tactica.png" alt="Táctica TIC">
  </a>

  <ul class="navbar__menu" [class.navbar__menu--open]="menuOpen">
    @for(item of navigationItems; track item.route) {
      <li>
        <a
          class="navbar__link"
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeMenu()">
          {{ item.label | translate }}
        </a>
      </li>
    }
  </ul>

  <div class="navbar__actions">
    <app-button
      variant="tertiary"
      iconOnly
      ariaLabel="Buscar"
      (buttonClick)="onSearchClick()">
      <img src="/assets/icons/icon-search.png" alt="">
    </app-button>

    <app-button
      variant="tertiary"
      size="sm"
      (buttonClick)="toggleLanguage()">
      {{ currentLanguage.toUpperCase() }}
    </app-button>

    <div class="navbar__hamburger">
      <app-button
        variant="tertiary"
        iconOnly
        ariaLabel="Abrir menu"
        (buttonClick)="toggleMenu()">
        <img src="/assets/icons/menu.svg" alt="">
      </app-button>
    </div>
  </div>
</nav>
