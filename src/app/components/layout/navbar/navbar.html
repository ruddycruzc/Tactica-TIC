<nav class="navbar">

  <a routerLink="/" class="navbar__logo">

    <img src="/assets/images/logo-TT-rosa.png" alt="Táctica TIC">

  </a>

  <ul class="navbar__menu" [class.navbar__menu--open]="menuOpen">
@if(menuOpen && searchOpen){

  <li class="navbar__search-mobile">

    <input
      type="text"
      placeholder="Buscar..."
      [(ngModel)]="searchTerm">

  </li>

}
    @for(item of navigationItems; track item.route){

    <li>

      <a [routerLink]="item.route" routerLinkActive="active-link" [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeMenu()">

        {{ item.label | translate }}

      </a>

    </li>

    }

  </ul>

  <div class="navbar__actions">

    <div class="navbar__search">

      @if(searchOpen){

      <input type="text" class="navbar__search-input" placeholder="Buscar..." [(ngModel)]="searchTerm">

      }

      <app-button variant="tertiary" iconOnly ariaLabel="Buscar" (buttonClick)="toggleSearch()">

        <img src="/assets/icons/icon-search.png" alt="">

      </app-button>

    </div>

    <app-button variant="tertiary" size="sm" (buttonClick)="toggleLanguage()">

      {{ currentLanguage.toUpperCase() }}

    </app-button>
    <div class="navbar__hamburger">
      <app-button variant="tertiary" iconOnly ariaLabel="abrirmenu" (buttonClick)="toggleMenu()">

        <img src="/assets/icons/menu.svg" alt="menu">

      </app-button>
    </div>

  </div>

</nav>
