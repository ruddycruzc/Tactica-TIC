<section class="video-container home-section">
  <div class="video-content home-section__inner reveal-up">
    <div class="video-left">
      <div class="video-wrapper">
        <video controls preload="metadata" poster="/assets/images/interview.jpg">
          <source src="/assets/Videos/Video.mp4" type="video/mp4">
        </video>
      </div>
    </div>

    <div class="video-right">
      <h2 class="section-title">
        {{ videoContent.title | translate }}
      </h2>

      <p class="section-description">
        {{ videoContent.description | translate }}
      </p>

      <p class="section-lead">
        {{ videoContent.lead | translate }}
      </p>
    </div>
  </div>
</section>
