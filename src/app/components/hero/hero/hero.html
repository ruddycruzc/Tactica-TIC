<section
  class="hero-container"
  [class.hero-container--active]="isPointerActive"
  [style.--hero-x.%]="cursorX"
  [style.--hero-y.%]="cursorY"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="onPointerLeave()"
>
  <div class="hero-wave" aria-hidden="true">
    <svg class="hero-wave__svg hero-wave__svg--base" viewBox="0 0 1200 360" preserveAspectRatio="none">
      @for (path of wavePaths; track path) {
        <path [attr.d]="path"></path>
      }
    </svg>

    <svg class="hero-wave__svg hero-wave__svg--focus" viewBox="0 0 1200 360" preserveAspectRatio="none">
      @for (path of wavePaths; track path) {
        <path [attr.d]="path"></path>
      }
    </svg>
  </div>

  
  <div class="hero-content">
    <div class="hero-left">
      <h1 class="hero-title">
        Tecnología que <br>
        <span class="highlight-green">evoluciona</span> contigo
      </h1>
    </div>

    <div class="hero-right">
      <p class="hero-description">
        Combinamos tecnología, automatización y estrategia digital para ayudarte a optimizar procesos, conectar herramientas y hacer crecer tu negocio de forma inteligente y progresiva.
      </p>
      <div class="hero-buttons">
        <app-button variant="primary" routerLink="/about">
          Conócenos <span class="arrow">→</span>
        </app-button>
        <app-button variant="secondary" routerLink="/projects">
          Nuestra visión <span class="arrow">→</span>
        </app-button>
      </div>
    </div>
  </div>

</section>
