<section
  class="hero-container"
  [class.hero-container--active]="isPointerActive"
  [style.--hero-x.%]="cursorX"
  [style.--hero-y.%]="cursorY"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="onPointerLeave()"
>
  <div class="hero-wave" aria-hidden="true">
    <svg class="hero-wave__svg hero-wave__svg--base" viewBox="0 0 1200 360" preserveAspectRatio="none">
      @for (path of wavePaths; track path) {
        <path [attr.d]="path"></path>
      }
    </svg>

    <svg class="hero-wave__svg hero-wave__svg--focus" viewBox="0 0 1200 360" preserveAspectRatio="none">
      @for (path of wavePaths; track path) {
        <path [attr.d]="path"></path>
      }
    </svg>
  </div>

  <div class="hero-content">

    <div class="hero-left">

      <h1 class="hero-title">
        {{ 'HOME.TITLE_LINE_1' | translate }}
        <br>
        <span class="highlight-green">
          {{ 'HOME.TITLE_HIGHLIGHT' | translate }}
        </span>
        {{ 'HOME.TITLE_LINE_2' | translate }}
      </h1>

    </div>

    <div class="hero-right">

      <p class="hero-description">
        {{ 'HOME.DESCRIPTION' | translate }}
      </p>

      <div class="hero-buttons">

        <a
          routerLink="/about"
          class="btn-primary">

          {{ 'HOME.ABOUT_BUTTON' | translate }}
          <span class="arrow">→</span>

        </a>

        <a
          routerLink="/projects"
          class="btn-secondary">

          {{ 'HOME.VISION_BUTTON' | translate }}
          <span class="arrow">→</span>

        </a>

      </div>

    </div>

  </div>

</section>
