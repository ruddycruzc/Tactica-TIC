<section
  class="hero-container"
  [class.hero-container--active]="isPointerActive"
  [style.--hero-x.%]="cursorX"
  [style.--hero-y.%]="cursorY"
  (pointermove)="onPointerMove($event)"
  (pointerleave)="onPointerLeave()"
>
  <div class="hero-ambient" aria-hidden="true">
    <div class="hero-grid hero-grid--base"></div>
    <div class="hero-grid hero-grid--focus"></div>
    <div class="hero-lens"></div>
  </div>

  
  <div class="hero-content">
    <div class="hero-left">
      <h1 class="hero-title">
        Tecnología que <br>
        <span class="highlight-green">evoluciona</span> contigo
      </h1>
    </div>

    <div class="hero-right">
      <p class="hero-description">
        Combinamos tecnología, automatización y estrategia digital para ayudarte a optimizar procesos, conectar herramientas y hacer crecer tu negocio de forma inteligente y progresiva.
      </p>
      <div class="hero-buttons">
        <a routerLink="/about" class="btn-primary">
          Conócenos <span class="arrow">→</span>
        </a>
        <a routerLink="/projects" class="btn-secondary">
          Nuestra visión <span class="arrow">→</span>
        </a>
      </div>
    </div>
  </div>

</section>
