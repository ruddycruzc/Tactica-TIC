<article class="expandable-image-card" [class.expandable-image-card--expanded]="expanded">
  @if (mediaType === 'video') {
    <video
      class="expandable-image-card__media"
      [src]="image"
      autoplay
      muted
      loop
      playsinline
      preload="metadata"
      [attr.aria-label]="imageAlt || title"
    ></video>
  } @else {
    <img
      class="expandable-image-card__media"
      [src]="image"
      [alt]="imageAlt || title"
      loading="lazy"
      decoding="async"
    >
  }

  <div class="expandable-image-card__content">
    <h3>{{ title }}</h3>
    @if (description) {
      <p>{{ description }}</p>
    }
  </div>
</article>
