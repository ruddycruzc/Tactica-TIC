<section class="logos-carousel" aria-labelledby="logos-carousel-title">
  <h2 id="logos-carousel-title" class="logos-carousel__title">Empresas&nbsp; que confían en nosotros</h2>

  <div class="logos-carousel__viewport">
    <div class="logos-carousel__track">
      <div class="logos-carousel__group" aria-label="Empresas colaboradoras">
        @for (logo of logos; track logo.src) {

        <div class="logos-carousel__item">

          <img [src]="logo.src" [alt]="logo.alt" class="logos-carousel__logo" />

        </div>

        }
      </div>

   
<div class="logos-carousel__group" aria-hidden="true">

  @for (logo of logos; track logo.src) {

    <div class="logos-carousel__item">

      <img
        [src]="logo.src"
        alt=""
        class="logos-carousel__logo" />

    </div>

  }

</div>
      </div>
    </div>

</section>
