<section class="cards-carousel">
  <div class="cards-carousel__header">
    <div class="cards-carousel__intro">
      <h2 class="cards-carousel__title">Nuestro equipo</h2>
      <p class="cards-carousel__subtitle">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    </div>
    <div class="cards-carousel__controls">
      <button type="button" class="carousel-button" aria-label="Anterior" (click)="prev()">‹</button>
      <button type="button" class="carousel-button" aria-label="Siguiente" (click)="next()">›</button>
    </div>
  </div>

  <div
    #viewport
    class="cards-carousel__viewport"
    (pointerdown)="startDrag($event)"
    (pointermove)="drag($event)"
    (pointerup)="endDrag($event)"
    (pointercancel)="endDrag($event)"
  >
    <div class="cards-carousel__track">
      <div class="cards-carousel__slide" *ngFor="let card of cards">
        <article class="carousel-card">
          <div class="carousel-card__image" [style.backgroundImage]="'url(' + card.image + ')'" aria-hidden="true"></div>
          <div class="carousel-card__overlay"></div>
          <div class="carousel-card__content">
            <h3 class="carousel-card__name">{{ card.name }}</h3>
            <p class="carousel-card__excerpt">{{ card.excerpt }}</p>
            <p class="carousel-card__details">{{ card.details }}</p>
          </div>
        </article>
      </div>
    </div>
  </div>
</section>
